# Don authorized automatic Shepherd publishing and merging on 2026-09-17.
# Read from the default branch. CI, drafts, holds, explicit review requests,
# conflict checks, isolation, rate caps and the circuit breaker still apply.
owner: don
auto_publish: true
auto_merge_to_default: true
auto_merge_to_secondary: true
# YAML positive infinity removes the LOC-only human approval gate.
max_loc_for_auto_merge: .inf
fresh_pr_hold_minutes: 10
held_labels: [wip, hold, do-not-merge, dontmerge, blocked]
publish_branch_denylist: [wip/, tmp/, private/, _scratch/]
publish_min_idle_minutes: 5
