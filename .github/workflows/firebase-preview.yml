name: Firebase Preview

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  functions-test:
    runs-on: ubuntu-latest
    name: Functions Tests (drift guard)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run Jest tests
        run: |
          cd functions
          npm test

  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to 3.24.5 — Flutter 3.27 made IconData a final class, breaking
          # font_awesome_flutter 10.x. Pinning here unblocks CI without forcing
          # an SDK-wide migration of all FontAwesomeIcons.* call sites.
          # Tracked for follow-up as a separate Flutter-migration task.
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd app
          flutter build web --release

      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: habu-1gxak2
          channelId: 'pr-${{ github.event.pull_request.number }}'
          expires: 7d
