name: Firebase Preview

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  functions-test:
    runs-on: ubuntu-latest
    name: Functions Tests (drift guard)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run Jest tests
        run: |
          cd functions
          npm test

  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.38.6 (Dart 3.10.7), matching the committed pubspec.lock.
          # The repo's pins (google_fonts 6.3.2 needs Dart ^3.7.0, url_launcher_web
          # 2.4.1 needs ^3.6.0) require a current SDK; font_awesome_flutter 11.x
          # restores Flutter 3.27+ support (IconData became final in 3.27).
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd app
          flutter build web --release

      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: habu-1gxak2
          channelId: 'pr-${{ github.event.pull_request.number }}'
          expires: 7d
