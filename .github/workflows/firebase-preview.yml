name: Firebase Preview

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  functions-test:
    runs-on: ubuntu-latest
    name: Functions Tests (drift guard)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run Jest tests
        run: |
          cd functions
          npm test

  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Only the web app produces a preview. A PR that changes nothing under app/**
      # (e.g. CI config or docs) would rebuild byte-identical web output, and Firebase
      # Hosting rejects a preview release whose version matches the current active one
      # ("supplied version is the current active version", HTTP 400 FAILED_PRECONDITION).
      # Detect whether the app actually changed and skip the build + deploy when it didn't,
      # so config/docs PRs pass instead of false-failing on a no-op preview.
      - name: Detect app changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
              - 'firebase.json'
              - '.firebaserc'

      - name: Setup Flutter
        if: steps.changes.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.38.6 (Dart 3.10.7), matching the committed pubspec.lock.
          # The repo's pins (google_fonts 6.3.2 needs Dart ^3.7.0, url_launcher_web
          # 2.4.1 needs ^3.6.0) require a current SDK; font_awesome_flutter 11.x
          # restores Flutter 3.27+ support (IconData became final in 3.27).
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Get Flutter dependencies
        if: steps.changes.outputs.app == 'true'
        run: |
          cd app
          flutter pub get

      - name: Build Flutter Web
        if: steps.changes.outputs.app == 'true'
        env:
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
        run: |
          cd app
          flutter build web --release --dart-define=GMAPS_API_KEY="$GMAPS_API_KEY"

      # Key was scrubbed from source (P0 2026-06-10); web/index.html ships a
      # placeholder that gets substituted into the build artifact here.
      - name: Inject Google Maps API key into web build
        if: steps.changes.outputs.app == 'true'
        env:
          GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
        run: node scripts/inject-gmaps-key.mjs app/build/web/index.html

      - name: Deploy to Firebase Preview Channel
        if: steps.changes.outputs.app == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: habu-1gxak2
          channelId: 'pr-${{ github.event.pull_request.number }}'
          expires: 7d

      - name: No preview needed
        if: steps.changes.outputs.app != 'true'
        run: echo "No app/** changes in this PR — skipping Flutter build and Firebase preview (avoids the no-op preview 400)."
